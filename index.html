<div class="cart-panel" id="cartPanel">

    <button class="checkout-btn" id="checkoutBtn" type="button">Checkout</button>
</div>


<div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-box">
        <h1></h1>
        <p>call the staff on whats app to help you.</p>
        <p class="phone-number"></p>
        <a class="whatsapp-btn" id="whatsappLink" href="#" target="_blank">Send on WhatsApp</a>

    </div>
</div>

</aside>

<main class="content">

    <a href="#" class="cart-link">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
    </a>
<h1 class="logo">Nours Makeup</h1>

<form class="search-bar" id="searchForm">
    <input type="text" id="searchInput" placeholder="What are you looking for?">
    <div class="select-wrap">
        <select>
            <option>All</option>
            <option>Face</option>
            <option>Eyes</option>
            <option>Tools</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    </div>
    <button class="search-btn" type="submit">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
        </svg>
    </button>
</form>

<div class="hero-banner">
    <img src="images/cocooo.jpg" alt="Nours Makeup">
    <div class="hero-text">Nours Makeup</div>
</div>



    <section class="products" id="products">
